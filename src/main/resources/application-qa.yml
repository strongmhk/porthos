# ============================================================
# QA 환경 전용 설정
# 실행: java -jar app.jar --spring.profiles.active=qa
#
# - 앱 포트       : 8081
# - 관리 포트     : 8082  (Spring Security 적용 안 됨, 방화벽으로 Prometheus IP만 허용)
# - AWS 알림      : 이용 불가 (SES/SNS/Lambda 호출은 비동기 내에서 조용히 실패)
# - Slack 알림    : 정상 동작 (slack.yml 설정 그대로 사용)
# - mysql.yml, redis.yml, jwt.yml, slack.yml 은 application.yml 에서 이미 import 됨
# ============================================================

spring:
  config:
    activate:
      on-profile: qa

# ----------------------------------------------------------
# 서버 포트 (prod: 8080 → qa: 8081)
# ----------------------------------------------------------
server:
  port: 8081

# ----------------------------------------------------------
# Spring Actuator + Prometheus
# management.server.port 가 다르면 Spring Security 필터 체인 미적용
# ----------------------------------------------------------
management:
  server:
    port: 8082
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: "health,info,prometheus,metrics,loggers,threaddump"
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      environment: qa
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
      slo:
        http.server.requests: 100ms, 300ms, 500ms, 1s
  prometheus:
    metrics:
      export:
        enabled: true
        step: 15s

# ----------------------------------------------------------
# 로깅 (QA에서는 DEBUG 레벨로 상세 출력)
# ----------------------------------------------------------
logging:
  level:
    root: INFO
    com.swyp.noticore: DEBUG
