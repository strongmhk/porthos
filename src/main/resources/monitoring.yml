---
spring.config.activate.on-profile: qa

# 관리 포트 : 8082 (Spring Security 적용 안 됨, 방화벽으로 Prometheus IP만 허용)
management:
  server:
    port: 8082
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: "health,info,prometheus,metrics,loggers,threaddump"
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      environment: qa
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5, 0.95, 0.99
      slo:
        http.server.requests: 100ms, 300ms, 500ms, 1s
  prometheus:
    metrics:
      export:
        enabled: true
        step: 15s
