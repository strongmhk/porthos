spring:
  config:
    import:
      - mysql.yml
      - slack.yml
      - jwt.yml
      - redis.yml
      - monitoring.yml
      - swagger.yml
  application:
    name: noticore

server:
  forward-headers-strategy: framework

logging:
  level:
    root: INFO

---
spring.config.activate.on-profile: local

logging:
  level:
    root: INFO

---
spring.config.activate.on-profile: qa

# - 앱 포트       : 8081
# - 관리 포트     : 8082  (Spring Security 적용 안 됨, 방화벽으로 Prometheus IP만 허용)
# - AWS 알림      : 이용 불가 (SES/SNS/Lambda 호출은 비동기 내에서 조용히 실패)
# - Slack 알림    : 정상 동작 (slack.yml 설정 그대로 사용)

server:
  port: 8081

logging:
  level:
    root: INFO
    com.swyp.noticore: DEBUG

---
spring.config.activate.on-profile: prod

logging:
  level:
    root: INFO
